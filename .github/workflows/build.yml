name: Build
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 17
          os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}
    # Container jobs are only supported on Linux runners; Windows and macOS use setup-java instead.
    container: ${{ startsWith(matrix.os, 'ubuntu') && 
      format('eclipse-temurin:{0}', matrix.java) || '' }}
    steps:
    - name: Disable CRLF conversion
      if: runner.os == 'Windows'
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v4
      # The build needs JDK 8, 9, 11 and 16 toolchains to compile test data. No vendor ships those for
      # Windows aarch64, so on the Windows arm64 runner install x64 builds, which run under the
      # built-in x64 emulation. This step runs before the main JDK step so that JAVA_HOME still
      # points at the main JDK afterwards.
    - name: Set up x64 test data toolchains (Windows arm64)
      if: matrix.os == 'windows-latest' && matrix.arch == 'arm64'
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        architecture: x64
        java-version: |
          8
          9
          11
          16
    - name: Set up Java
      if: runner.os != 'Linux'
      uses: actions/setup-java@v4
      with:
          # Temurin has no Windows aarch64 build of JDK 17, so the Windows arm64 runner uses the
          # Microsoft Build of OpenJDK instead. It ships Windows aarch64 builds of both 17 and 21.
        distribution: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'microsoft' || 'temurin' }}
        java-version: ${{ matrix.java }}
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.repository_owner != 'Vineflower' || 
          !(contains(github.ref_name, 'develop') || contains(github.ref_name, 
          'master')) }}
    - name: Build with Gradle
      shell: bash
      run: |
        ./gradlew build --stacktrace ${{ (matrix.os == 'windows-latest' && matrix.arch == 'arm64') && '-Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_9_X64,JAVA_HOME_11_X64,JAVA_HOME_16_X64' || '' }}
    - name: Archive test results
      if: "${{ always() }}"
      uses: actions/upload-artifact@v4
      with:
        name: "test-results-java${{ matrix.java }}-${{ matrix.os }}-${{ matrix.arch
          }}"
        path: |
          build/reports/
          plugins/*/build/reports/
          build/test-results/**/*.xml
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
